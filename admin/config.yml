# ═══════════════════════════════════════════════════════════════
# Painel de edição do site da Biblioteca Escolar da ESP
#
# Este ficheiro descreve os FORMULÁRIOS que a equipa vê em /admin.
# Quem atualiza o site NÃO precisa de abrir este ficheiro.
# Só a manutenção técnica mexe aqui (para acrescentar um campo novo).
# ═══════════════════════════════════════════════════════════════

backend:
  name: github
  repo: BE-ESParedes/be.esp
  branch: main
  # Entrada no painel: botão «Sign in with Token» (não é preciso instalar nada).
  # Se um dia se quiser o botão «Sign in with GitHub», acrescentar aqui
  #   base_url: https://<autenticador>.workers.dev
  # e instalar o Sveltia CMS Authenticator (ver ADMIN.md, secção «Entrada mais cómoda»).

# Onde ficam as imagens e os cartazes carregados pelo painel.
media_folder: imagens
public_folder: imagens

# Guardar rascunhos antes de publicar (fluxo editorial com revisão).
publish_mode: simple

output:
  json:
    indent_size: 2

locale: pt

collections:

  # ─────────────────────────────────────────────────────────────
  - name: inicio
    label: 1 · Página inicial
    icon: home
    description: 'O topo do site: as imagens que rodam, os atalhos e o que está em destaque.'
    format: json
    files:

      - name: banners
        label: Banners do topo
        file: content/banners.json
        description: As imagens grandes que rodam no topo da página inicial.
        fields:
          - name: banners
            label: Banners
            widget: list
            label_singular: banner
            summary: '{{fields.titulo}}'
            fields:
              - { name: imagem, label: Imagem de fundo, widget: image, required: false, media_folder: /imagens/banners, public_folder: imagens/banners, hint: 'Larga e horizontal. Exportar até 300 KB.' }
              - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false, hint: 'Descreve a imagem em poucas palavras, para quem não a vê.' }
              - { name: tag, label: Etiqueta pequena, widget: string, required: false }
              - { name: titulo, label: Título, widget: string, hint: 'Pode usar <em>palavra</em> para destacar uma palavra a dourado.' }
              - { name: texto, label: Texto, widget: text, required: false }
              - name: botoes
                label: Botões
                widget: list
                required: false
                label_singular: botão
                summary: '{{fields.rotulo}}'
                fields:
                  - { name: rotulo, label: Texto do botão, widget: string }
                  - { name: url, label: Ligação, widget: string, required: false }

      - name: missoes
        label: 'Quero… (cartões de missão)'
        file: content/missoes.json
        icon: target
        fields:
          - name: missoes
            label: Missões
            widget: list
            label_singular: Missão
            summary: '{{fields.rotulo}}'
            fields:
              - { name: rotulo, label: 'Quero…', widget: string, hint: 'Comece por um verbo: encontrar, fazer, participar.' }
              - { name: texto, label: Explicação, widget: string }
              - { name: icone, label: Ícone, widget: select, options: [livro, ficheiro, calendario, camara, monitor, maos, lupa, alvo, estrela, globo] }
              - { name: url, label: Para onde leva, widget: string }

      - name: acessoRapido
        label: Acesso rápido
        file: content/acessoRapido.json
        description: Os atalhos grandes logo abaixo dos banners.
        fields:
          - name: acessoRapido
            label: Atalhos
            widget: list
            label_singular: atalho
            summary: '{{fields.rotulo}}'
            fields:
              - { name: rotulo, label: Título, widget: string }
              - { name: sub, label: Subtítulo, widget: string, required: false }
              - { name: acao, label: Texto do botão, widget: string, required: false, hint: 'Ex.: Pesquisar, Abrir, Consultar.' }
              - name: icone
                label: Ícone
                widget: select
                required: false
                options: [livro, monitor, lupa, relogio, calendario, correio, pessoas, local, ficheiro, globo, escudo, cerebro, auscultador, camara, estrela, ligacao, cadeado, maos, pasta, bandeira, microfone, balao, alvo, chave, seta, info]
              - name: cor
                label: Cor do cartão
                widget: select
                required: false
                options:
                  - { label: 'Neutra (branco)', value: '' }
                  - { label: 'Menta', value: menta }
                  - { label: 'Dourado', value: dourado }
              - { name: imagem, label: Imagem de fundo (opcional), widget: image, required: false, media_folder: /imagens/cartoes, public_folder: imagens/cartoes, hint: 'Opcional. Exportar até 300 KB.' }
              - { name: alt, label: Descrição da imagem, widget: string, required: false }
              - { name: url, label: Ligação, widget: string, required: false }

  - name: conteudos
    label: 2 · Conteúdos para ler e usar
    icon: book
    description: 'Tudo o que a Biblioteca escolhe e recomenda: livros, formatos digitais, fontes e ferramentas.'
    format: json
    files:

      - name: sugestoesLeitura
        label: 'Catálogo · Sugestões de leitura'
        file: content/sugestoesLeitura.json
        icon: book
        fields:
          - name: sugestoesLeitura
            label: Faixas
            widget: list
            label_singular: Faixa
            summary: '{{fields.faixa}}'
            fields:
              - { name: faixa, label: Nome da faixa, widget: string }
              - { name: nota, label: Subtítulo, widget: string, required: false }
              - name: livros
                label: Livros
                widget: list
                label_singular: Livro
                summary: '{{fields.titulo}}'
                fields:
                  - { name: titulo, label: Título, widget: string, required: false }
                  - { name: autor, label: Autor, widget: string, required: false }
                  - { name: imagem, label: Capa, widget: image, required: false, media_folder: /imagens/capas, public_folder: imagens/capas, hint: 'Vertical, 2:3. Até 120 KB.' }
                  - { name: alt, label: Descrição da capa, widget: string, required: false }
                  - { name: url, label: Ligação, widget: string, required: false }

      - name: livrosDigitais
        label: Livros digitais
        file: content/livrosDigitais.json
        description: Obras completas de acesso livre e legal, para ler no ecrã.
        fields:
          - name: livrosDigitais
            label: Livros digitais
            widget: list
            label_singular: livro digital
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string, required: true }
              - { name: autor, label: Autor, widget: string, required: false }
              - { name: imagem, label: Capa, widget: image, required: false, media_folder: /imagens/digitais, public_folder: imagens/digitais, hint: 'Exportar até 300 KB. O painel escreve o caminho sozinho.' }
              - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false, hint: 'O que se vê na imagem, para quem não a vê. Não é a recomendação.' }
              - { name: porque, label: "Porque é que a Biblioteca recomenda isto?", widget: text, required: false, hint: 'Uma ou duas frases nossas, para alunos. Não copiar do site de origem.' }
              - { name: publico, label: Para quem, widget: string, required: false, hint: 'Ex.: 10.º ao 12.º ano; todos os anos.' }
              - { name: genero, label: Género ou tema, widget: string, required: false }
              - { name: fonte, label: Fonte ou plataforma, widget: string, required: false, hint: 'Quem disponibiliza. Ex.: Imprensa Nacional, RTP Antena 2.' }
              - { name: url, label: Endereço (URL), widget: string, required: false, hint: 'O endereço real e verificado. Uma ligação inventada é pior do que uma ficha por preencher.' }
              - { name: cta, label: Texto do botão, widget: string, required: false, hint: 'Ex.: Ler online, Ouvir. Por omissão: Abrir.' }
              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
              - { name: direitos, label: Direitos ou licença, widget: string, required: false }
      - name: audiolivros
        label: Audiolivros
        file: content/audiolivros.json
        description: Histórias para ouvir, de fontes legais.
        fields:
          - name: audiolivros
            label: Audiolivros
            widget: list
            label_singular: audiolivro
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string, required: true }
              - { name: autor, label: Autor, widget: string, required: false }
              - { name: imagem, label: Capa, widget: image, required: false, media_folder: /imagens/audio, public_folder: imagens/audio, hint: 'Exportar até 300 KB. O painel escreve o caminho sozinho.' }
              - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false, hint: 'O que se vê na imagem, para quem não a vê. Não é a recomendação.' }
              - { name: porque, label: "Porque é que a Biblioteca recomenda isto?", widget: text, required: false, hint: 'Uma ou duas frases nossas, para alunos. Não copiar do site de origem.' }
              - { name: publico, label: Para quem, widget: string, required: false, hint: 'Ex.: 10.º ao 12.º ano; todos os anos.' }
              - { name: genero, label: Género ou tema, widget: string, required: false }
              - { name: voz, label: Lido por, widget: string, required: false }
              - { name: duracao, label: Duração, widget: string, required: false, hint: 'Ex.: 4 h 24 min; 33 min.' }
              - { name: fonte, label: Fonte ou plataforma, widget: string, required: false, hint: 'Quem disponibiliza. Ex.: Imprensa Nacional, RTP Antena 2.' }
              - { name: url, label: Endereço (URL), widget: string, required: false, hint: 'O endereço real e verificado. Uma ligação inventada é pior do que uma ficha por preencher.' }
              - { name: cta, label: Texto do botão, widget: string, required: false, hint: 'Ex.: Ler online, Ouvir. Por omissão: Abrir.' }
              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
              - { name: direitos, label: Direitos ou licença, widget: string, required: false }
      - name: podcasts
        label: Podcasts
        file: content/podcasts.json
        description: Conversas sobre livros, autores e ideias.
        fields:
          - name: podcasts
            label: Podcasts
            widget: list
            label_singular: podcast
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string, required: true }
              - { name: autor, label: Autor ou emissora, widget: string, required: false }
              - { name: imagem, label: Imagem, widget: image, required: false, media_folder: /imagens/podcasts, public_folder: imagens/podcasts, hint: 'Exportar até 300 KB. O painel escreve o caminho sozinho.' }
              - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false, hint: 'O que se vê na imagem, para quem não a vê. Não é a recomendação.' }
              - { name: porque, label: "Porque é que a Biblioteca recomenda isto?", widget: text, required: false, hint: 'Uma ou duas frases nossas, para alunos. Não copiar do site de origem.' }
              - { name: publico, label: Para quem, widget: string, required: false, hint: 'Ex.: 10.º ao 12.º ano; todos os anos.' }
              - { name: genero, label: Género ou tema, widget: string, required: false }
              - { name: duracao, label: Duração ou periodicidade, widget: string, required: false }
              - { name: fonte, label: Fonte ou plataforma, widget: string, required: false, hint: 'Quem disponibiliza. Ex.: Imprensa Nacional, RTP Antena 2.' }
              - { name: url, label: Endereço (URL), widget: string, required: false, hint: 'O endereço real e verificado. Uma ligação inventada é pior do que uma ficha por preencher.' }
              - { name: cta, label: Texto do botão, widget: string, required: false, hint: 'Ex.: Ler online, Ouvir. Por omissão: Abrir.' }
              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
              - { name: direitos, label: Direitos ou licença, widget: string, required: false }
      - name: videos
        label: Vídeos
        file: content/videos.json
        description: Vídeos do YouTube. Basta colar o endereço do vídeo.
        fields:
          - name: videos
            label: Vídeos
            widget: list
            label_singular: vídeo
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: descricao, label: Descrição breve, widget: text, required: false }
              - { name: url, label: Endereço do vídeo, widget: string, hint: 'Colar o endereço do YouTube tal como aparece na barra do browser.' }
              - { name: data, label: Data, widget: string, required: false, hint: 'Ex.: out 2026' }

              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
              - { name: imagem, label: Miniatura (opcional), widget: image, required: false, media_folder: /imagens/videos, public_folder: imagens/videos }
              - { name: porque, label: "Porque é que a Biblioteca recomenda isto?", widget: text, required: false }
              - { name: publico, label: Para quem, widget: string, required: false }
  # ─────────────────────────────────────────────────────────────

      - name: leituraAcessivel
        label: Leitura acessível
        file: content/leituraAcessivel.json
        description: Recursos e formatos para diferentes formas de aceder à leitura.
        fields:
          - name: leituraAcessivel
            label: Leitura acessível
            widget: list
            label_singular: recurso
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string, required: true }
              - { name: autor, label: Autor ou entidade, widget: string, required: false }
              - { name: imagem, label: Imagem, widget: image, required: false, media_folder: /imagens/acessivel, public_folder: imagens/acessivel, hint: 'Exportar até 300 KB. O painel escreve o caminho sozinho.' }
              - { name: alt, label: Descrição da imagem (acessibilidade), widget: string, required: false, hint: 'O que se vê na imagem, para quem não a vê. Não é a recomendação.' }
              - { name: porque, label: "Porque é que a Biblioteca recomenda isto?", widget: text, required: false, hint: 'Uma ou duas frases nossas, para alunos. Não copiar do site de origem.' }
              - { name: publico, label: Para quem, widget: string, required: false, hint: 'Ex.: 10.º ao 12.º ano; todos os anos.' }
              - { name: genero, label: Género ou tema, widget: string, required: false }
              - { name: fonte, label: Fonte ou plataforma, widget: string, required: false, hint: 'Quem disponibiliza. Ex.: Imprensa Nacional, RTP Antena 2.' }
              - { name: url, label: Endereço (URL), widget: string, required: false, hint: 'O endereço real e verificado. Uma ligação inventada é pior do que uma ficha por preencher.' }
              - { name: cta, label: Texto do botão, widget: string, required: false, hint: 'Ex.: Ler online, Ouvir. Por omissão: Abrir.' }
              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
              - { name: direitos, label: Direitos ou licença, widget: string, required: false }
      - name: bibliotecaDigital
        label: Biblioteca Digital
        file: content/bibliotecaDigital.json
        description: Recursos em linha verificados pela Biblioteca.
        fields:
          - name: bibliotecaDigital
            label: Recursos
            widget: list
            label_singular: recurso
            summary: '{{fields.nome}}'
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: descricao, label: Descrição breve, widget: text }
              - name: tipo
                label: Tipo
                widget: select
                options:
                  - { label: 'Repositórios', value: repositorios }
                  - { label: 'Livros digitais', value: ebooks }
                  - { label: 'Imprensa', value: imprensa }
                  - { label: 'Multimédia', value: multimedia }
              - name: acesso
                label: Tipo de acesso
                widget: select
                options:
                  - { label: 'Livre', value: livre }
                  - { label: 'Com registo', value: registo }
                  - { label: 'Só na escola', value: escola }
              - { name: url, label: Ligação, widget: string }
              - { name: verificado, label: Verificado pela Biblioteca, widget: boolean, default: true }
              - { name: imagem, label: Imagem, widget: image, required: false, media_folder: /imagens/projetos, public_folder: imagens/projetos, hint: 'Opcional. Exportar até 300 KB.' }
              - name: icone
                label: Ícone
                widget: select
                required: false
                options: [globo, livro, monitor, ficheiro, lupa, estrela, camara, microfone]

              - { name: destaque, label: "Destacar em «O que a Biblioteca está a destacar»", widget: boolean, required: false, default: false, hint: 'Aparece na montra da página Ler. Poucos e escolhidos.' }
              - { name: destaqueHome, label: Destacar também na página inicial, widget: boolean, required: false, default: false, hint: 'A página inicial mostra no máximo quatro.' }
      - name: disciplinas
        label: Recursos por disciplina
        file: content/disciplinas.json
        fields:
          - name: disciplinas
            label: Disciplinas
            widget: list
            label_singular: disciplina
            summary: '{{fields.nome}}'
            fields:
              - { name: nome, label: Disciplina, widget: string }
              - name: essenciais
                label: Recursos essenciais
                widget: list
                required: false
                summary: '{{fields.titulo}}'
                fields:
                  - { name: titulo, label: Título, widget: string }
                  - { name: url, label: Ligação, widget: string, required: false }
              - name: aprofundamento
                label: Aprofundamento
                widget: list
                required: false
                summary: '{{fields.titulo}}'
                fields:
                  - { name: titulo, label: Título, widget: string }
                  - { name: url, label: Ligação, widget: string, required: false }
              - name: propostas
                label: Propostas de aula ou projeto
                widget: list
                required: false
                summary: '{{fields.titulo}}'
                fields:
                  - { name: titulo, label: Título, widget: string }
                  - { name: url, label: Ligação, widget: string, required: false }
              - name: testados
                label: Materiais testados com turmas
                widget: list
                required: false
                summary: '{{fields.titulo}}'
                fields:
                  - { name: titulo, label: Título, widget: string }
                  - { name: url, label: Ligação, widget: string, required: false }

      - name: ligacoesUteis
        label: Ligações úteis
        file: content/ligacoesUteis.json
        fields:
          - name: ligacoesUteis
            label: Ligações
            widget: list
            label_singular: ligação
            summary: '{{fields.grupo}} — {{fields.nome}}'
            fields:
              - name: grupo
                label: Grupo
                widget: select
                create: true
                options: [Ler, Investigar, Escrever, Criar, Cidadania]
              - { name: nome, label: Nome, widget: string }
              - { name: url, label: Ligação, widget: string, required: false }
              - name: acesso
                label: Tipo de acesso
                widget: select
                options:
                  - { label: 'Livre', value: livre }
                  - { label: 'Com registo', value: registo }
                  - { label: 'Só na escola', value: escola }

      - name: ferramentas
        label: Ferramentas
        file: content/ferramentas.json
        description: 'Ferramentas úteis, explicadas: o que é, para que serve e quando usar.'
        fields:
          - name: ferramentas
            label: Ferramentas
            widget: list
            label_singular: ferramenta
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Nome, widget: string, required: true }
              - { name: oQueE, label: O que é, widget: text, required: false }
              - { name: paraQue, label: Para que serve, widget: text, required: false }
              - { name: quandoUsar, label: Quando usar, widget: text, required: false }
              - { name: tarefa, label: Tarefa, widget: select, required: false, options: [escrever, apresentar, criar, pesquisar, organizar, imagem, vídeo, IA] }
              - { name: url, label: Endereço (URL), widget: string, required: false }
              - { name: icone, label: Ícone, widget: string, required: false }
              - { name: destaque, label: Mostrar nos destaques, widget: boolean, required: false }

      - name: guioes
        label: Guiões e métodos de estudo
        file: content/guioes.json
        fields:
          - name: guioes
            label: Guiões
            widget: list
            label_singular: guião
            summary: '{{fields.titulo}}'
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: descricao, label: Descrição, widget: text, required: false }
              - { name: url, label: Ligação (PDF do OneDrive), widget: string, required: false }
              - name: icone
                label: Ícone
                widget: select
                required: false
                options: [alvo, ficheiro, estrela, escudo, cerebro, monitor, lupa, livro]

      - name: percursos
        label: 'Apoio ao Estudo · Percursos «hoje quero…»'
        file: content/percursos.json
        icon: route
        fields:
          - name: percursos
            label: Percursos
            widget: list
            label_singular: Percurso
            summary: '{{fields.rotulo}}'
            fields:
              - { name: id, label: Identificador, widget: string, hint: 'Sem espaços nem acentos: trabalho, teste, citar.' }
              - { name: rotulo, label: 'Quero…', widget: string }
              - { name: resumo, label: Resumo, widget: text }
              - { name: icone, label: Ícone, widget: string, required: false }
              - { name: duracao, label: Duração, widget: string, required: false }
              - { name: preparacao, label: Ainda em preparação, widget: boolean, required: false, default: false }
              - { name: nota, label: 'Nota (só se estiver em preparação)', widget: string, required: false }
              - name: passos
                label: Passos
                widget: list
                required: false
                label_singular: Passo
                summary: '{{fields.n}} · {{fields.titulo}}'
                fields:
                  - { name: n, label: Número, widget: string }
                  - { name: titulo, label: Título, widget: string }
                  - { name: texto, label: Texto, widget: text, hint: 'Aceita <em>itálico</em> e <br> para mudar de linha.' }
                  - name: recursos
                    label: Recursos deste passo
                    widget: list
                    required: false
                    summary: '{{fields.titulo}}'
                    fields:
                      - { name: titulo, label: Nome, widget: string }
                      - { name: url, label: Ligação, widget: string, required: false }

      - name: literaciaPercurso
        label: 'Apoio ao Estudo · Literacia digital'
        file: content/literaciaPercurso.json
        icon: shield
        fields:
          - name: literaciaPercurso
            label: Etapas
            widget: list
            label_singular: Etapa
            summary: '{{fields.n}} · {{fields.titulo}}'
            fields:
              - { name: n, label: Número, widget: string }
