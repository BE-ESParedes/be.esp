backend:
  name: git-gateway
  branch: main

# Permite testar o painel localmente (com o decap-server a correr).
# Em produção (Netlify) é ignorado e usa-se o git-gateway acima.
local_backend: true

locale: pt
publish_mode: simple
media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: info
    label: "Informação geral"
    delete: false
    files:
      - name: unico
        label: "Informação geral"
        file: "content/info.json"
        format: json
        description: "Dados gerais da Biblioteca usados em todas as páginas (cabeçalho, rodapé, contactos)."
        fields:
          - label: "Informação geral"
            name: info
            widget: object
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Escola", name: escola, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Telefone", name: telefone, widget: string, required: false }
              - { label: "Horário (curto, rodapé)", name: horario, widget: string }
              - { label: "Horário (longo)", name: horarioLongo, widget: string }
              - { label: "Localização", name: localizacao, widget: string }
              - { label: "Lugares", name: lugares, widget: string }
              - { label: "Código RBE", name: codigoRBE, widget: string }
              - label: "Equipa"
                name: equipa
                widget: list
                fields:
                  - { label: "Função", name: funcao, widget: string }
                  - { label: "Nome", name: nome, widget: string }
              - { label: "Missão (texto longo)", name: missao, widget: text }
              - { label: "Missão (frase do rodapé)", name: missaoCurta, widget: text }
              - { label: "Instagram", name: instagram, widget: string, required: false }
              - { label: "Facebook", name: facebook, widget: string, required: false }
              - { label: "YouTube", name: youtube, widget: string, required: false, hint: "A confirmar o endereço do canal." }
              - { label: "Site da escola", name: siteEscola, widget: string, required: false }
              - { label: "OPAC pesquisa simples", name: opacSimples, widget: string, required: false }
              - { label: "OPAC pesquisa avançada", name: opacAvancada, widget: string, required: false }
              - { label: "Biblioteca Municipal", name: bibliotecaMunicipal, widget: string, required: false }
              - { label: "RBE", name: rbe, widget: string, required: false }
              - { label: "PNL", name: pnl, widget: string, required: false }
              - { label: "DGE", name: dge, widget: string, required: false }
              - { label: "Google Maps", name: mapa, widget: string, required: false }
              - { label: "Link de marcação (Bookings)", name: linkMarcacao, widget: string, required: false }
              - { label: "Formulário externo (opcional)", name: linkFormulario, widget: string, required: false }
              - { label: "Repositório GitHub", name: repositorioGitHub, widget: string, required: false }

  - name: banners
    label: "Destaques (carrossel)"
    delete: false
    files:
      - name: lista
        label: "Destaques (carrossel)"
        file: "content/banners.json"
        format: json
        description: "Os banners rotativos no topo da página inicial."
        fields:
          - label: "Destaques (carrossel)"
            name: banners
            widget: list
            label_singular: "Banner"
            summary: "{{fields.tag}}"
            fields:
              - { label: "Etiqueta", name: tag, widget: string }
              - { label: "Título", name: titulo, widget: string, hint: "Podes destacar uma palavra a dourado com <em>palavra</em>" }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Imagem de fundo (opcional)", name: imagem, widget: image, required: false }
              - label: "Botões"
                name: botoes
                widget: list
                required: false
                fields:
                  - { label: "Rótulo", name: rotulo, widget: string }
                  - { label: "Ligação", name: url, widget: string, hint: "URL externo ou página do site (ex.: atividades.html)" }

  - name: noticias
    label: "Notícias"
    delete: false
    files:
      - name: lista
        label: "Notícias"
        file: "content/noticias.json"
        format: json
        description: "As notícias da página inicial e do separador Notícias."
        fields:
          - label: "Notícias"
            name: noticias
            widget: list
            label_singular: "Notícia"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Data (texto)", name: data, widget: string, hint: "Ex.: 12 jul 2026" }
              - { label: "Data de ordenação", name: dataOrdenacao, widget: string, hint: "AAAA-MM-DD (define a ordem)" }
              - { label: "Categoria", name: categoria, widget: string }
              - { label: "Resumo", name: resumo, widget: text }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }
              - { label: "Ícone (se não houver imagem)", name: emoji, widget: string, default: "📰" }
              - label: "Cor"
                name: cor
                widget: select
                default: "#A8D8CC"
                options:
                  - { label: "Menta", value: "#A8D8CC" }
                  - { label: "Dourado", value: "#D8B260" }
                  - { label: "Verde profundo", value: "#20493B" }
              - { label: "Ligação «ler mais»", name: url, widget: string, required: false }

  - name: agenda
    label: "Agenda"
    delete: false
    files:
      - name: lista
        label: "Agenda"
        file: "content/agenda.json"
        format: json
        description: "Próximas atividades (início e Atividades)."
        fields:
          - label: "Agenda"
            name: agenda
            widget: list
            label_singular: "Evento"
            summary: "{{fields.dia}} {{fields.mes}} — {{fields.titulo}}"
            fields:
              - { label: "Dia", name: dia, widget: string }
              - { label: "Mês", name: mes, widget: string, hint: "Ex.: Abr" }
              - { label: "Ano", name: ano, widget: string, required: false }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Local e hora", name: local, widget: string }
              - { label: "Ligação", name: url, widget: string, required: false }

  - name: acessoRapido
    label: "Acesso rápido"
    delete: false
    files:
      - name: lista
        label: "Acesso rápido"
        file: "content/acessoRapido.json"
        format: json
        description: "Os seis atalhos da página inicial."
        fields:
          - label: "Acesso rápido"
            name: acessoRapido
            widget: list
            label_singular: "Atalho"
            summary: "{{fields.rotulo}}"
            fields:
              - { label: "Ícone", name: icone, widget: string }
              - { label: "Rótulo", name: rotulo, widget: string }
              - { label: "Ligação", name: url, widget: string }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: metricas
    label: "Números da Biblioteca"
    delete: false
    files:
      - name: lista
        label: "Números da Biblioteca"
        file: "content/metricas.json"
        format: json
        description: "Os quatro números destacados na página inicial."
        fields:
          - label: "Números da Biblioteca"
            name: metricas
            widget: list
            label_singular: "Número"
            summary: "{{fields.valor}} {{fields.legenda}}"
            fields:
              - { label: "Valor", name: valor, widget: string }
              - { label: "Legenda", name: legenda, widget: string }

  - name: regras
    label: "Regras de utilização"
    delete: false
    files:
      - name: lista
        label: "Regras de utilização"
        file: "content/regras.json"
        format: json
        description: "Regras mostradas em A Biblioteca. Uma regra por linha."
        fields:
          - label: "Regras de utilização"
            name: regras
            widget: list

  - name: documentos
    label: "Documentos"
    delete: false
    files:
      - name: lista
        label: "Documentos"
        file: "content/documentos.json"
        format: json
        description: "Documentos estruturantes (A Biblioteca e rodapé)."
        fields:
          - label: "Documentos"
            name: documentos
            widget: list
            label_singular: "Documento"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Ficheiro PDF", name: url, widget: file, required: false, hint: "Sem ficheiro, mostra «brevemente disponível»." }

  - name: projetosEscola
    label: "Projetos da escola"
    delete: false
    files:
      - name: lista
        label: "Projetos da escola"
        file: "content/projetosEscola.json"
        format: json
        description: "Projetos da escola ligados a partir de A Biblioteca."
        fields:
          - label: "Projetos da escola"
            name: projetosEscola
            widget: list
            label_singular: "Projeto"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Ligação", name: url, widget: string, required: false }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: galeria
    label: "Galeria"
    delete: false
    files:
      - name: lista
        label: "Galeria"
        file: "content/galeria.json"
        format: json
        description: "Fotografias da galeria. Só publicar imagens com consentimento RGPD."
        fields:
          - label: "Galeria"
            name: galeria
            widget: list
            label_singular: "Fotografia"
            summary: "{{fields.legenda}}"
            fields:
              - { label: "Imagem", name: imagem, widget: image, required: false }
              - { label: "Texto alternativo da imagem", name: alt, widget: string, required: false, hint: "Descreve a imagem para quem não a vê." }
              - { label: "Legenda", name: legenda, widget: string }

  - name: destaquesCatalogo
    label: "Destaques do catálogo"
    delete: false
    files:
      - name: lista
        label: "Destaques do catálogo"
        file: "content/destaquesCatalogo.json"
        format: json
        description: "Sugestões e novidades mostradas no Catálogo."
        fields:
          - label: "Destaques do catálogo"
            name: destaquesCatalogo
            widget: list
            label_singular: "Destaque"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Autor", name: autor, widget: string, required: false }
              - { label: "Nota", name: nota, widget: text, required: false }
              - { label: "Capa", name: imagem, widget: image, required: false }

  - name: bibliotecaDigital
    label: "Biblioteca Digital"
    delete: false
    files:
      - name: lista
        label: "Biblioteca Digital"
        file: "content/bibliotecaDigital.json"
        format: json
        description: "Recursos digitais verificados. Rever as ligações uma vez por período."
        fields:
          - label: "Biblioteca Digital"
            name: bibliotecaDigital
            widget: list
            label_singular: "Recurso"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Descrição (uma linha)", name: descricao, widget: string }
              - label: "Tipo"
                name: tipo
                widget: select
                options:
                  - { label: "E-books", value: "ebooks" }
                  - { label: "Audiolivros", value: "audiolivros" }
                  - { label: "Jornais e revistas", value: "imprensa" }
                  - { label: "Repositórios", value: "repositorios" }
              - label: "Acesso"
                name: acesso
                widget: select
                options: [livre, institucional, misto]
              - { label: "Ligação", name: url, widget: string }
              - { label: "Verificado pela Biblioteca", name: verificado, widget: boolean, default: true }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: faq
    label: "Perguntas frequentes"
    delete: false
    files:
      - name: lista
        label: "Perguntas frequentes"
        file: "content/faq.json"
        format: json
        description: "Acordeão de perguntas frequentes no Catálogo."
        fields:
          - label: "Perguntas frequentes"
            name: faq
            widget: list
            label_singular: "Pergunta"
            summary: "{{fields.pergunta}}"
            fields:
              - { label: "Pergunta", name: pergunta, widget: string }
              - { label: "Resposta", name: resposta, widget: text }

  - name: guioes
    label: "Guiões e apoio ao estudo"
    delete: false
    files:
      - name: lista
        label: "Guiões e apoio ao estudo"
        file: "content/guioes.json"
        format: json
        description: "Guiões da página Recursos. Sem ficheiro, mostra «brevemente disponível»."
        fields:
          - label: "Guiões e apoio ao estudo"
            name: guioes
            widget: list
            label_singular: "Guião"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descrição", name: descricao, widget: string }
              - { label: "Ficheiro ou ligação", name: url, widget: file, required: false }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: disciplinas
    label: "Recursos por disciplina"
    delete: false
    files:
      - name: lista
        label: "Recursos por disciplina"
        file: "content/disciplinas.json"
        format: json
        description: "Apoio ao currículo, por disciplina (página Recursos)."
        fields:
          - label: "Recursos por disciplina"
            name: disciplinas
            widget: list
            label_singular: "Disciplina"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Disciplina", name: nome, widget: string }
              - label: "Recursos essenciais"
                name: essenciais
                widget: list
                required: false
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Ligação", name: url, widget: string, required: false }
              - label: "Aprofundamento"
                name: aprofundamento
                widget: list
                required: false
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Ligação", name: url, widget: string, required: false }
              - label: "Propostas de aula ou projeto"
                name: propostas
                widget: list
                required: false
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Ligação", name: url, widget: string, required: false }
              - label: "Materiais da BE testados"
                name: testados
                widget: list
                required: false
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Ligação", name: url, widget: string, required: false }

  - name: desafioMes
    label: "Desafio do mês"
    delete: false
    files:
      - name: unico
        label: "Desafio do mês"
        file: "content/desafioMes.json"
        format: json
        description: "Destaque de literacia digital na página Recursos."
        fields:
          - label: "Desafio do mês"
            name: desafioMes
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Ligação", name: url, widget: string, required: false }

  - name: ligacoesUteis
    label: "Ligações úteis"
    delete: false
    files:
      - name: lista
        label: "Ligações úteis"
        file: "content/ligacoesUteis.json"
        format: json
        description: "Ligações por finalidade (página Recursos)."
        fields:
          - label: "Ligações úteis"
            name: ligacoesUteis
            widget: list
            label_singular: "Ligação"
            summary: "{{fields.grupo}} — {{fields.nome}}"
            fields:
              - label: "Grupo"
                name: grupo
                widget: select
                options: ["Ler", "Investigar", "Escrever", "Criar", "Aprender digitalmente"]
              - { label: "Nome", name: nome, widget: string }
              - { label: "Ligação", name: url, widget: string, required: false }
              - { label: "Acesso", name: acesso, widget: select, options: [livre, institucional, misto], default: livre }

  - name: exposicoes
    label: "Exposições"
    delete: false
    files:
      - name: lista
        label: "Exposições"
        file: "content/exposicoes.json"
        format: json
        description: "Exposições da Biblioteca, com 8 fotografias. Consentimento RGPD obrigatório."
        fields:
          - label: "Exposições"
            name: exposicoes
            widget: list
            label_singular: "Exposição"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Período", name: periodo, widget: string }
              - { label: "Descrição", name: descricao, widget: text }
              - label: "Fotografias (até 8)"
                name: imagens
                widget: list
                fields:
                  - { label: "Ficheiro", name: ficheiro, widget: image, required: false }
                  - { label: "Texto alternativo", name: alt, widget: string, required: false }

  - name: projetos
    label: "Projetos da Biblioteca"
    delete: false
    files:
      - name: lista
        label: "Projetos da Biblioteca"
        file: "content/projetos.json"
        format: json
        description: "Projetos próprios da Biblioteca."
        fields:
          - label: "Projetos da Biblioteca"
            name: projetos
            widget: list
            label_singular: "Projeto"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Descrição", name: descricao, widget: text }
              - { label: "Estado", name: estado, widget: select, options: [ativo, concluído] }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: iniciativasNacionais
    label: "Iniciativas nacionais"
    delete: false
    files:
      - name: lista
        label: "Iniciativas nacionais"
        file: "content/iniciativasNacionais.json"
        format: json
        description: "Rever no início de cada ano letivo. As de estado «arquivo» aparecem agrupadas no fim."
        fields:
          - label: "Iniciativas nacionais"
            name: iniciativasNacionais
            widget: list
            label_singular: "Iniciativa"
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - label: "Área"
                name: area
                widget: select
                options: ["Leitura e escrita", "Media e informação", "Ciência e outras literacias", "Cidadania e participação", "Artes, cultura e efemérides"]
              - { label: "Descrição", name: descricao, widget: text }
              - label: "Estado da participação"
                name: estado
                widget: select
                options: ["participamos", "já participámos", "aberta a inscrições", "arquivo"]
              - { label: "Ligação oficial", name: url, widget: string }
              - { label: "Imagem (ocupa o cartão)", name: imagem, widget: image, required: false }

  - name: trabalhosAlunos
    label: "Trabalhos de alunos"
    delete: false
    files:
      - name: lista
        label: "Trabalhos de alunos"
        file: "content/trabalhosAlunos.json"
        format: json
        description: "Trabalhos de alunos. Consentimento RGPD obrigatório."
        fields:
          - label: "Trabalhos de alunos"
            name: trabalhosAlunos
            widget: list
            label_singular: "Trabalho"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Autores", name: autores, widget: string, hint: "Primeiro nome e inicial. Nunca o nome completo de menores." }
              - { label: "Descrição", name: descricao, widget: text }
              - label: "Fotografias (até 4)"
                name: fotos
                widget: list
                fields:
                  - { label: "Ficheiro", name: ficheiro, widget: image, required: false }
                  - { label: "Texto alternativo", name: alt, widget: string, required: false }

  - name: areaTrabalho
    label: "Área de Trabalho (ligações)"
    delete: false
    files:
      - name: unico
        label: "Área de Trabalho (ligações)"
        file: "content/areaTrabalho.json"
        format: json
        description: "Ligações de trabalho da equipa."
        fields:
          - label: "Área de Trabalho (ligações)"
            name: areaTrabalho
            widget: object
            fields:
              - label: "Ligações rápidas"
                name: ligacoes
                widget: list
                fields:
                  - { label: "Nome", name: nome, widget: string }
                  - { label: "Ligação", name: url, widget: string, required: false }

