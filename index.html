<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início · Biblioteca Escolar da ESP</title>
<meta name="description" content="Site da Biblioteca Escolar da Escola Secundária de Paredes: catálogo, recursos, atividades e notícias.">
<meta property="og:title" content="Início · Biblioteca Escolar da ESP">
<meta property="og:description" content="Site da Biblioteca Escolar da Escola Secundária de Paredes: catálogo, recursos, atividades e notícias.">
<meta property="og:image" content="imagens/logo/og.png">
<meta property="og:type" content="website">
<!-- Favicon do BrandKit (04_Icons). Substituir quando o ficheiro existir. -->
<link rel="icon" href="imagens/logo/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body id="p-inicio">
<a class="skip" href="#conteudo">Saltar para o conteúdo</a>
<div id="cabecalho"></div>
<main id="conteudo">

  <div class="carousel" id="carousel" role="region" aria-roledescription="carrossel" aria-label="Destaques da Biblioteca" tabindex="0">
    <div class="slides" id="slides"></div>
    <button class="car-btn prev" id="car-prev" aria-label="Destaque anterior">‹</button>
    <button class="car-btn next" id="car-next" aria-label="Destaque seguinte">›</button>
    <div class="dots" id="car-dots"></div>
  </div>

  <div class="wrap pad">
    <h2 class="sec-title">Notícias e destaques</h2><div class="rule"></div>
    <div class="news" id="home-news"></div>
    <p style="margin-top:22px"><a class="btn verde" href="noticias.html">Ver todas as notícias</a></p>
  </div>

  <div class="soft"><div class="wrap pad">
    <h2 class="sec-title">Acesso rápido</h2><div class="rule"></div>
    <div class="grid3" id="acesso-rapido"></div>
  </div></div>

  <div class="wrap pad">
    <h2 class="sec-title">Bem-vindos à Biblioteca</h2><div class="rule"></div>
    <p class="sec-lead" id="missao" style="max-width:860px"></p>
    <div class="metric" id="metricas"></div>
    <p class="note">Valores indicativos, a confirmar com os dados oficiais da Biblioteca.</p>
  </div>

  <div class="soft"><div class="wrap pad">
    <h2 class="sec-title">Agenda</h2><div class="rule"></div>
    <ul class="agenda" id="home-agenda"></ul>
    <p style="margin-top:22px"><a class="btn outline" href="atividades.html">Ver todas as atividades</a></p>
  </div></div>

</main>
<div id="rodape"></div>
<script>
window.renderPagina = function(){
  const i = CONTEUDO.info || {};
  const m = document.getElementById('missao'); if (m) m.textContent = i.missao || '';
  const ar = document.getElementById('acesso-rapido');
  if (ar) ar.innerHTML = (CONTEUDO.acessoRapido||[]).map(a =>
    `<a class="card" ${/^https?:/i.test(a.url)?`href="${a.url}" target="_blank" rel="noopener"`:`href="${a.url}"`}>
       <span class="ic">${a.icone||'🔗'}</span><h3>${a.rotulo}</h3></a>`).join('');
  const mt = document.getElementById('metricas');
  if (mt) mt.innerHTML = (CONTEUDO.metricas||[]).map(x => `<div><b>${x.valor}</b><span>${x.legenda}</span></div>`).join('');
};
</script>
<script src="motor.js"></script>
</body>
</html>
