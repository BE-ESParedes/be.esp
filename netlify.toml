# Configuração de publicação do site da Biblioteca Escolar da ESParedes.
# Site estático (sem build). A raiz do repositório é a raiz do site.

[build]
  publish = "."

# Cabeçalhos de segurança básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
